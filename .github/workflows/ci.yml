name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0

      - name: Build matrix
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/udpgw
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/udpgw

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n ugw.sh
